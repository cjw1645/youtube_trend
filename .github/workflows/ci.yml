name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run format:check
      # 합성 데이터·모의 fetch만 사용한다. 실제 API Key나 외부 서비스가 필요 없다.
      - run: npm test
      - run: npm run build
